name: Fix Auth0 token exchange

on:
  workflow_dispatch:
  push:
    paths:
      - '.auth0-patch-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Auth0 token exchange
        shell: bash
        run: python3 .github/scripts/patch-auth0-exchange.py

      - name: Verify patch
        shell: bash
        run: |
          grep -n -A8 -B4 'client_secret' src/CareLink/Helpers/LoginHelpers/CareLinkService.vb
          grep -n 'CareLink/6.0.1.6' src/CareLink/Helpers/LoginHelpers/CareLinkService.vb

      - name: Commit patched source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/CareLink/Helpers/LoginHelpers/CareLinkService.vb
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Fix Auth0 token exchange request"
          git push
