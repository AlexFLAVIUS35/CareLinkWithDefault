name: Build CareLink fixed release

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'src/CareLink/Helpers/LoginHelpers/CareLinkService.vb'
      - 'src/CareLink/Helpers/LoginHelpers/OAuthBrowserForm.vb'
      - 'src/CareLink/Helpers/LoginHelpers/DefaultBrowserOAuth.vb'
      - 'src/CareLink/Dialogs/LoginDialog.vb'
      - '.github/workflows/create-release-6.0.1.6.yml'
      - '.github/scripts/patch-login.ps1'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch and verify login source
        shell: pwsh
        run: .\.github\scripts\patch-login.ps1

      - name: Install .NET 11 preview SDK
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://dot.net/v1/dotnet-install.ps1' -OutFile "$env:TEMP\dotnet-install.ps1"
          & "$env:TEMP\dotnet-install.ps1" -Channel 11.0 -Quality preview -InstallDir "$env:GITHUB_WORKSPACE\.dotnet"
          & "$env:GITHUB_WORKSPACE\.dotnet\dotnet.exe" --version

      - name: Restore
        shell: pwsh
        run: .\.dotnet\dotnet.exe restore CareLink.sln

      - name: Prepare Windows media resources for build
        shell: pwsh
        run: |
          $target = 'D:\Windows\Media'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item 'C:\Windows\Media\Alarm01.wav' "$target\Alarm01.wav" -Force
          Copy-Item 'C:\Windows\Media\Alarm02.wav' "$target\Alarm02.wav" -Force
          if (-not (Test-Path "$target\Alarm01.wav") -or -not (Test-Path "$target\Alarm02.wav")) {
            throw 'Could not prepare Windows alarm resources.'
          }

      - name: Build and publish Windows app
        shell: pwsh
        run: .\.dotnet\dotnet.exe publish src\CareLink\CareLink.vbproj -c Release -r win-x64 --self-contained false -o publish

      - name: Commit source patch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/CareLink/Helpers/LoginHelpers/CareLinkService.vb src/CareLink/Dialogs/LoginDialog.vb
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Fix CareLink browser login deadlock'
            git push
          } else {
            Write-Host 'Login source patch was already committed.'
          }

      - name: Create application archive
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath CareLink6.0.1.6-default-browser-fixed.zip -Force

      - name: Create source archives
        shell: pwsh
        run: |
          git archive --format=zip --output=6.0.1.6-source-default-browser-fixed.zip HEAD
          git archive --format=tar.gz --output=6.0.1.6-source-default-browser-fixed.tar.gz HEAD

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '6.0.1.6-default-browser-fixed'
          gh release delete $tag --repo "$env:GITHUB_REPOSITORY" --yes --cleanup-tag 2>$null
          gh release create $tag --repo "$env:GITHUB_REPOSITORY" --title 'CareLink 6.0.1.6 (Default Browser + Auth0 Fix)' --generate-notes CareLink6.0.1.6-default-browser-fixed.zip 6.0.1.6-source-default-browser-fixed.zip 6.0.1.6-source-default-browser-fixed.tar.gz
