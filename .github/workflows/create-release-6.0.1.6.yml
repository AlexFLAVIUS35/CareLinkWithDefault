name: Build CareLink fixed release

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - src/CareLink/Helpers/LoginHelpers/CareLinkService.vb
      - src/CareLink/Helpers/LoginHelpers/OAuthBrowserForm.vb
      - src/CareLink/Helpers/LoginHelpers/DefaultBrowserOAuth.vb
      - src/CareLink/Dialogs/LoginDialog.vb
      - .github/workflows/create-release-6.0.1.6.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch and verify login source
        shell: pwsh
        run: |
          $servicePath = "src/CareLink/Helpers/LoginHelpers/CareLinkService.vb"
          $service = Get-Content -Raw -Encoding UTF8 $servicePath
          $service = $service.Replace('If String.IsNullOrWhiteSpace(value:=magIdentifier) Then', 'If Not String.IsNullOrWhiteSpace(value:=magIdentifier) Then')
          if ($service -notmatch 'If Not String\.IsNullOrWhiteSpace\(value:=magIdentifier\) Then') {
            throw 'mag-identifier header fix could not be verified.'
          }
          Set-Content -Path $servicePath -Value $service -Encoding UTF8

          $loginPath = "src/CareLink/Dialogs/LoginDialog.vb"
          $login = Get-Content -Raw -Encoding UTF8 $loginPath
          $login = $login.Replace('Me.LoginStatus.Text = "Checking token file..."', 'Me.LoginStatus.Text = "Checking CareLink connection..."')
          $catchPattern = '(?s)Catch ex As Exception\r?\n            Stop\r?\n        Finally\r?\n            Me\.Ok_Button\.Enabled = True\r?\n            Me\.Cancel_Button\.Enabled = True'
          $catchReplacement = "Catch ex As Exception`r`n            Dim errorMessage As String = If(String.IsNullOrWhiteSpace(ex.Message), \"The login operation failed.\", ex.Message)`r`n            ReportLoginStatus(Me.LoginStatus, hasErrors:=True, lastErrorMsg:=errorMessage, lastHttpStatusCode:=CInt(HttpStatusCode.InternalServerError))`r`n            MessageBox.Show(Me, errorMessage, \"CareLink Login\", MessageBoxButtons.OK, MessageBoxIcon.Error)`r`n        Finally`r`n            Me.Ok_Button.Enabled = True`r`n            Me.Cancel_Button.Enabled = True"
          $patchedLogin = [regex]::Replace($login, $catchPattern, $catchReplacement, 1)
          if ($patchedLogin -eq $login) {
            throw 'LoginDialog exception handler could not be located.'
          }
          Set-Content -Path $loginPath -Value $patchedLogin -Encoding UTF8
          Write-Host 'Login source hardening applied and verified.'

      - name: Install .NET 11 preview SDK
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://dot.net/v1/dotnet-install.ps1' -OutFile "$env:TEMP\dotnet-install.ps1"
          & "$env:TEMP\dotnet-install.ps1" -Channel 11.0 -Quality preview -InstallDir "$env:GITHUB_WORKSPACE\.dotnet"
          & "$env:GITHUB_WORKSPACE\.dotnet\dotnet.exe" --version

      - name: Restore
        shell: pwsh
        run: .\.dotnet\dotnet.exe restore CareLink.sln

      - name: Prepare Windows media resources for build
        shell: pwsh
        run: |
          $target = 'D:\Windows\Media'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item 'C:\Windows\Media\Alarm01.wav' "$target\Alarm01.wav" -Force
          Copy-Item 'C:\Windows\Media\Alarm02.wav' "$target\Alarm02.wav" -Force
          if (-not (Test-Path "$target\Alarm01.wav") -or -not (Test-Path "$target\Alarm02.wav")) {
            throw 'Could not prepare Windows alarm resources.'
          }
          Write-Host 'Windows alarm resources prepared for MSBuild.'

      - name: Build and publish Windows app
        shell: pwsh
        run: |
          .\.dotnet\dotnet.exe publish src\CareLink\CareLink.vbproj -c Release -r win-x64 --self-contained false -o publish

      - name: Commit source patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/CareLink/Helpers/LoginHelpers/CareLinkService.vb src/CareLink/Dialogs/LoginDialog.vb
          if (-not (git diff --cached --quiet)) {
            git commit -m "Harden CareLink login error handling"
            git push
          } else {
            Write-Host "Login source patch was already committed."
          }

      - name: Create application archive
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath CareLink6.0.1.6-default-browser-fixed.zip -Force

      - name: Create source archives
        shell: pwsh
        run: |
          git archive --format=zip --output=6.0.1.6-source-default-browser-fixed.zip HEAD
          git archive --format=tar.gz --output=6.0.1.6-source-default-browser-fixed.tar.gz HEAD

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "6.0.1.6-default-browser-fixed"
          gh release delete $tag --repo "$env:GITHUB_REPOSITORY" --yes --cleanup-tag 2>$null
          gh release create $tag --repo "$env:GITHUB_REPOSITORY" --title "CareLink 6.0.1.6 (Default Browser + Auth0 Fix)" --generate-notes CareLink6.0.1.6-default-browser-fixed.zip 6.0.1.6-source-default-browser-fixed.zip 6.0.1.6-source-default-browser-fixed.tar.gz
