name: Build CareLink fixed release

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - src/CareLink/Helpers/LoginHelpers/CareLinkService.vb
      - src/CareLink/Helpers/LoginHelpers/OAuthBrowserForm.vb
      - src/CareLink/Helpers/LoginHelpers/DefaultBrowserOAuth.vb
      - src/CareLink/Dialogs/LoginDialog.vb
      - .github/workflows/create-release-6.0.1.6.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch and verify login source
        shell: pwsh
        run: |
          $servicePath = 'src/CareLink/Helpers/LoginHelpers/CareLinkService.vb'
          $service = Get-Content -Raw -Encoding UTF8 $servicePath
          $service = $service.Replace('Private Shared ReadOnly s_http As New HttpClient With {.Timeout = TimeSpan.FromSeconds(120)}', 'Private Shared ReadOnly s_http As New HttpClient With {.Timeout = TimeSpan.FromSeconds(15)}')
          $service = $service.Replace('Private Shared ReadOnly s_http As New HttpClient With {.Timeout = TimeSpan.FromSeconds(30)}', 'Private Shared ReadOnly s_http As New HttpClient With {.Timeout = TimeSpan.FromSeconds(15)}')
          $service = $service.Replace('If String.IsNullOrWhiteSpace(value:=magIdentifier) Then', 'If Not String.IsNullOrWhiteSpace(value:=magIdentifier) Then')
          $service = $service.Replace('Catch ex As Exception' + [Environment]::NewLine + '                            Stop', 'Catch ex As Exception' + [Environment]::NewLine + '                            Throw New ApplicationException(message:=$"Failed to parse CareLink endpoint configuration: {ex.Message}", innerException:=ex)')
          if ($service -notmatch 'TimeSpan\.FromSeconds\(15\)') { throw 'HTTP timeout fix could not be verified.' }
          if ($service -notmatch 'If Not String\.IsNullOrWhiteSpace\(value:=magIdentifier\) Then') { throw 'mag-identifier header fix could not be verified.' }
          if ($service -match 'Catch ex As Exception\r?\n\s+Stop') { throw 'A discovery exception handler still contains Stop.' }
          Set-Content -Path $servicePath -Value $service -Encoding UTF8

          $loginPath = 'src/CareLink/Dialogs/LoginDialog.vb'
          $login = Get-Content -Raw -Encoding UTF8 $loginPath
          if ($login -notmatch 'Imports System.Threading.Tasks') {
            $login = $login.Replace('Imports System.Net.Http' + [Environment]::NewLine, 'Imports System.Net.Http' + [Environment]::NewLine + 'Imports System.Threading.Tasks' + [Environment]::NewLine)
          }
          $oldDiscovery = 'Dim discoveryResult As DiscoveryRecord = Await GetDiscoveryDataAsync()'
          if ($login -match 'Task\.WhenAny\(discoveryTask') {
            Write-Host 'Login discovery timeout is already present.'
          } elseif ($login.IndexOf($oldDiscovery, [StringComparison]::Ordinal) -ge 0) {
            $newDiscovery = '            Me.LoginStatus.Text = "Loading CareLink discovery configuration..."' + [Environment]::NewLine +
                '            Me.Refresh()' + [Environment]::NewLine +
                '            Dim discoveryTask As Task(Of DiscoveryRecord) = GetDiscoveryDataAsync()' + [Environment]::NewLine +
                '            Dim discoveryCompleted As Task = Await Task.WhenAny(discoveryTask, Task.Delay(TimeSpan.FromSeconds(20)))' + [Environment]::NewLine +
                '            If Not Object.ReferenceEquals(discoveryCompleted, discoveryTask) Then' + [Environment]::NewLine +
                '                Throw New TimeoutException("CareLink discovery timed out after 20 seconds. Check your internet connection and try again.")' + [Environment]::NewLine +
                '            End If' + [Environment]::NewLine +
                '            Dim discoveryResult As DiscoveryRecord = Await discoveryTask'
            $login = $login.Replace($oldDiscovery, $newDiscovery)
          } else {
            throw 'Discovery call marker not found in LoginDialog.'
          }

          $login = $login.Replace('Me.Ok_Button.Enabled = False' + [Environment]::NewLine + '                Application.DoEvents()', 'Me.LoginStatus.Text = "Opening CareLink login..."' + [Environment]::NewLine + '                Me.Ok_Button.Enabled = False' + [Environment]::NewLine + '                Application.DoEvents()')
          $login = $login.Replace('Me.LoginStatus.Text = "Checking token file..."', 'Me.LoginStatus.Text = "Checking CareLink connection..."')

          $newCatchMarker = 'ReportLoginStatus(Me.LoginStatus, hasErrors:=True, lastErrorMsg:=errorMessage, lastHttpStatusCode:=CInt(HttpStatusCode.InternalServerError))'
          if ($login -notmatch [regex]::Escape($newCatchMarker)) {
            $catchPattern = '(?s)Catch ex As Exception\r?\n            Stop\r?\n        Finally\r?\n            Me\.Ok_Button\.Enabled = True\r?\n            Me\.Cancel_Button\.Enabled = True'
            $nl = [Environment]::NewLine
            $catchReplacement = 'Catch ex As Exception' + $nl +
                '            Dim errorMessage As String = If(String.IsNullOrWhiteSpace(ex.Message), "The login operation failed.", ex.Message)' + $nl +
                '            ReportLoginStatus(Me.LoginStatus, hasErrors:=True, lastErrorMsg:=errorMessage, lastHttpStatusCode:=CInt(HttpStatusCode.InternalServerError))' + $nl +
                '            MessageBox.Show(Me, errorMessage, "CareLink Login", MessageBoxButtons.OK, MessageBoxIcon.Error)' + $nl +
                '        Finally' + $nl +
                '            Me.Ok_Button.Enabled = True' + $nl +
                '            Me.Cancel_Button.Enabled = True'
            $patchedLogin = [regex]::Replace($login, $catchPattern, $catchReplacement, 1)
            if ($patchedLogin -eq $login) { throw 'LoginDialog exception handler could not be located.' }
            $login = $patchedLogin
          }
          if ($login -match 'Catch ex As Exception\r?\n\s+Stop\r?\n\s+Finally') { throw 'LoginDialog exception handler still contains Stop.' }
          if ($login -notmatch 'Task\.WhenAny\(discoveryTask') { throw 'Login discovery timeout fix could not be verified.' }
          Set-Content -Path $loginPath -Value $login -Encoding UTF8
          Write-Host 'Login source hardening applied and verified.'

      - name: Install .NET 11 preview SDK
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://dot.net/v1/dotnet-install.ps1' -OutFile "$env:TEMP\dotnet-install.ps1"
          & "$env:TEMP\dotnet-install.ps1" -Channel 11.0 -Quality preview -InstallDir "$env:GITHUB_WORKSPACE\.dotnet"
          & "$env:GITHUB_WORKSPACE\.dotnet\dotnet.exe" --version

      - name: Restore
        shell: pwsh
        run: .\.dotnet\dotnet.exe restore CareLink.sln

      - name: Prepare Windows media resources for build
        shell: pwsh
        run: |
          $target = 'D:\Windows\Media'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item 'C:\Windows\Media\Alarm01.wav' "$target\Alarm01.wav" -Force
          Copy-Item 'C:\Windows\Media\Alarm02.wav' "$target\Alarm02.wav" -Force
          if (-not (Test-Path "$target\Alarm01.wav") -or -not (Test-Path "$target\Alarm02.wav")) { throw 'Could not prepare Windows alarm resources.' }
          Write-Host 'Windows alarm resources prepared for MSBuild.'

      - name: Build and publish Windows app
        shell: pwsh
        run: .\.dotnet\dotnet.exe publish src\CareLink\CareLink.vbproj -c Release -r win-x64 --self-contained false -o publish

      - name: Commit source patch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/CareLink/Helpers/LoginHelpers/CareLinkService.vb src/CareLink/Dialogs/LoginDialog.vb
          if (-not (git diff --cached --quiet)) { git commit -m 'Fix CareLink discovery login hang'; git push } else { Write-Host 'Login source patch was already committed.' }

      - name: Create application archive
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath CareLink6.0.1.6-default-browser-fixed.zip -Force

      - name: Create source archives
        shell: pwsh
        run: |
          git archive --format=zip --output=6.0.1.6-source-default-browser-fixed.zip HEAD
          git archive --format=tar.gz --output=6.0.1.6-source-default-browser-fixed.tar.gz HEAD

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '6.0.1.6-default-browser-fixed'
          gh release delete $tag --repo "$env:GITHUB_REPOSITORY" --yes --cleanup-tag 2>$null
          gh release create $tag --repo "$env:GITHUB_REPOSITORY" --title 'CareLink 6.0.1.6 (Default Browser + Auth0 Fix)' --generate-notes CareLink6.0.1.6-default-browser-fixed.zip 6.0.1.6-source-default-browser-fixed.zip 6.0.1.6-source-default-browser-fixed.tar.gz
